[workspace]
members = ["crates/wtsapi32", "crates/wpehost", "crates/wpe-bridge"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
windows-sys = "0.61"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
